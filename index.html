<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSense AI</title><link rel="stylesheet" href="css/style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script></head>
<body><div class="app"><aside><div class="brand"><i>S</i><span class="lbl">StockSense AI</span></div><nav id="nav"></nav></aside>
<main><div class="top"><button class="ib" onclick="toggleNav()">☰</button><input id="gs" placeholder="Search products… (Enter)" onkeydown="if(event.key==='Enter'){F.q=this.value;F.page=0;location.hash='#inventory';route()}"><span class="sp"></span><small id="date"></small><button class="ib" onclick="theme()">◐</button><button class="ib" onclick="location.hash='#notifications'">🔔 <b id="bell"></b></button><button class="ib" onclick="if(confirm('Log out?')){sessionStorage.clear();location.href='login.html'}">Demo Admin ⏻</button></div><div id="view"></div></main></div>
<div id="modal" onclick="if(event.target==this)closeModal()"></div><div id="toast"></div>
<script src="js/app.js"></script></body></html>
