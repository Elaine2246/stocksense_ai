<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StockSense AI — Login</title><link rel="stylesheet" href="css/style.css"></head>
<body><div class="auth"><div class="l"><div class="brand"><i>S</i>StockSense AI</div><h2>Know your stock before it runs out.</h2><p>Inventory management, expiry tracking and reorder forecasts for shops, stores and warehouses.</p></div>
<div class="r"><form onsubmit="go(event)"><h1>Welcome back</h1><input id="e" type="email" placeholder="Email" value="demo@stocksense.ai"><input id="p" type="password" placeholder="Password" value="demo123"><p class="err" id="m"></p><button class="btn">Sign in</button><button type="button" class="ib" onclick="demo()">Use demo login</button><small>Demo authentication only — not production-secure.</small></form></div></div>
<script>function demo(){sessionStorage.setItem('ss_auth','1');location.href='index.html'}
function go(ev){ev.preventDefault();if(!/\S+@\S+\.\S+/.test(e.value))return m.textContent='Enter a valid email';if(p.value.length<4)return m.textContent='Password must be 4+ characters';demo()}</script></body></html>
